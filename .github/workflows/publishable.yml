name: publishable
on:
  workflow_call:
    inputs:
      scanner-ref:
        description: Ref of therogueroadmap/.github used to check out the scanner
        type: string
        required: false
        default: main
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: therogueroadmap/.github
          ref: ${{ inputs.scanner-ref }}
          path: .publishable-scanner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python .publishable-scanner/scripts/check_publishable.py .
