name: publishable
on:
  workflow_call:
    inputs:
      scanner-ref:
        description: Ref of therogueroadmap/.github used to check out the scanner
        type: string
        required: false
        default: main
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: therogueroadmap/.github
          ref: ${{ inputs.scanner-ref }}
          path: .publishable-scanner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python .publishable-scanner/scripts/check_publishable.py .
